services:
  - type: web
    name: ragverse-api
    runtime: docker
    rootDir: backend
    branch: main
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      - key: AUTH_PROVIDER
        value: supabase
      - key: STORAGE_MODE
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: ragverse
      - key: JWT_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: RAG_CHAT_MODELS
        value: groq:llama-3.3-70b-versatile,gemini:gemini-2.5-flash
      - key: VISION_MODELS
        value: gemini:gemini-2.5-flash
      - key: TRANSCRIPTION_MODELS
        value: groq:whisper-large-v3-turbo
      - key: EMBEDDING_MODELS
        value: gemini:gemini-embedding-001,cohere:embed-english-light-v3.0
