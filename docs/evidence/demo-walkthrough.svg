<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" role="img" aria-labelledby="title desc">
  <title id="title">Ragverse demo walkthrough</title>
  <desc id="desc">End-to-end demo flow from authentication to deletion.</desc>
  <rect width="1180" height="500" fill="#0b1020"/>
  <text x="56" y="72" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Demo Walkthrough</text>
  <text x="56" y="108" font-family="Inter, Arial, sans-serif" font-size="18" fill="#a8b3cf">Authenticated multimodal RAG flow with document isolation and cleanup.</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(56 158)">
      <rect width="190" height="170" rx="12" fill="#111827" stroke="#334155"/>
      <text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">1. Sign in</text>
      <text x="24" y="82" font-size="16" fill="#cbd5e1">Local SQLite or</text>
      <text x="24" y="106" font-size="16" fill="#cbd5e1">Supabase auth mode</text>
      <text x="24" y="140" font-size="15" fill="#86efac">User session scoped</text>
    </g>
    <g transform="translate(278 158)">
      <rect width="190" height="170" rx="12" fill="#111827" stroke="#334155"/>
      <text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">2. Add source</text>
      <text x="24" y="82" font-size="16" fill="#cbd5e1">Document, audio,</text>
      <text x="24" y="106" font-size="16" fill="#cbd5e1">or public URL</text>
      <text x="24" y="140" font-size="15" fill="#86efac">Guardrails applied</text>
    </g>
    <g transform="translate(500 158)">
      <rect width="190" height="170" rx="12" fill="#111827" stroke="#334155"/>
      <text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">3. Index</text>
      <text x="24" y="82" font-size="16" fill="#cbd5e1">Extract, transcribe,</text>
      <text x="24" y="106" font-size="16" fill="#cbd5e1">chunk, embed</text>
      <text x="24" y="140" font-size="15" fill="#86efac">Chroma per user</text>
    </g>
    <g transform="translate(722 158)">
      <rect width="190" height="170" rx="12" fill="#111827" stroke="#334155"/>
      <text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">4. Discuss</text>
      <text x="24" y="82" font-size="16" fill="#cbd5e1">Hybrid retrieval,</text>
      <text x="24" y="106" font-size="16" fill="#cbd5e1">rerank, cache</text>
      <text x="24" y="140" font-size="15" fill="#86efac">Provider fallback</text>
    </g>
    <g transform="translate(944 158)">
      <rect width="190" height="170" rx="12" fill="#111827" stroke="#334155"/>
      <text x="24" y="44" font-size="20" font-weight="700" fill="#ffffff">5. Delete</text>
      <text x="24" y="82" font-size="16" fill="#cbd5e1">Metadata, storage,</text>
      <text x="24" y="106" font-size="16" fill="#cbd5e1">cache, Chroma</text>
      <text x="24" y="140" font-size="15" fill="#86efac">User-owned cleanup</text>
    </g>
  </g>
  <path d="M247 243h30M469 243h30M691 243h30M913 243h30" stroke="#818cf8" stroke-width="4" stroke-linecap="round"/>
</svg>
